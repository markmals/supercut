# Matches the Oxfmt settings of the TypeScript projects: 100 columns, 4-space indents.
max_width = 100
tab_spaces = 4
hard_tabs = false
newline_style = "Unix"
# Prettier-style filling: use the full width before wrapping, like Oxfmt does.
use_small_heuristics = "Max"
# Stable rustfmt sorts imports within blank-line-separated groups but cannot create the groups
# (`group_imports` is nightly-only), so write std, external, then crate imports as separate
# groups by hand.
reorder_imports = true
reorder_modules = true
