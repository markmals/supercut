[package]
name = "supercut"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
html-escape = "0.3.0"
id3 = "1.17.2"
jiff = { version = "0.2.38", features = ["serde"] }
rss = { version = "2.1.2", default-features = false }
rusty-chromaprint = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = "3.4.2"

[dev-dependencies]
tempfile = "3.27.0"
