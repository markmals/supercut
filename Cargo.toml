[package]
name = "supercut"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
html-escape = "0.3.0"
id3 = "1.17.2"
jev-driver = { version = "0.1", default-features = false }
jiff = { version = "0.2.38", features = ["serde"] }
jsonc-parser = { version = "0.34.0", features = ["serde"] }
regex = "1.13.1"
rss = { version = "2.1.2", default-features = false }
rusty-chromaprint = "0.3.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
tempfile = "3.27.0"
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "sync"] }
ureq = "3.4.2"
url = "2.5.8"

# jev-driver's HTTP client uses the platform's TLS, which on Linux is OpenSSL. Building it from
# source spares a Linux machine the system OpenSSL headers (and the sudo to install them).
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
