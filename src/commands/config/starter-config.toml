# supercut configuration. Paths may start with `~`.
# Editorial rules per show are Markdown files in `rules/<slug>.md` next to this file.

# Downloaded episodes, transcripts, analysis and plans. Defaults to the platform data folder
# (`~/Library/Application Support/supercut/library` on macOS).
# library_dir = "~/Media/supercut"

# Where rendered supercuts go, one folder per show. `render` needs this.
output_dir = "~/Music/Supercuts"

# Podcast app folder that `render --sideload` copies finished supercuts into.
# sideload_dir = "~/Library/Mobile Documents/iCloud~co~supertop~castro/Documents/Sideloads"

[transcription]
# "mlx-whisper" (Apple silicon) or "whisper-cpp".
engine = "mlx-whisper"
# mlx-whisper: a Hugging Face repo or a model folder. whisper.cpp: a ggml model file.
model = "mlx-community/whisper-large-v3-turbo"
language = "en"

[loudness]
# Integrated loudness every episode is brought to before stitching.
target_lufs = -16.0
# Ceiling for the true-peak limiter, in dBTP.
true_peak_db = -1.5

[jev]
# The decision model that labels transcript windows.
endpoint = "https://api.typesafe.ai/v1/systemone"
model = "jev-1.13.0"
# Command that prints the API key. The TYPESAFE_API_KEY environment variable wins over it.
api_key_command = ["op", "read", "op://Personal/TypeSafe/api-key"]
# Requests in flight at once.
concurrency = 8

# One section per show. The key is the slug every command takes.
[shows.example-show]
title = "Example Show"
# Feeds are read in order; an episode in several of them keeps the first feed's copy. A private
# feed's auth token stays in the URL, and supercut never prints it.
feeds = ["https://example.com/feed.xml"]
# Cover art embedded in rendered supercuts.
artwork = "~/Pictures/supercut/example-show.jpg"
# Clip played between episodes; `supercut episodes clip` cuts one out of an episode.
interstitial = "~/Music/supercut/example-show-interstitial.flac"
# Recordings of the theme songs and jingles that open episodes, one clip each. `plans draft`
# cuts each episode up to the end of the one it plays; a supercut's first episode is cut on to
# the hosts' first words.
themes = ["~/Music/supercut/example-show-theme.flac"]
# Recordings of the first notes of the music that leads into the credits, cut from just after a
# goodbye. `plans draft` cuts each episode from where one starts to the end of the file.
outros = ["~/Music/supercut/example-show-outro.flac"]
# Recordings of jingles that close some episodes, e.g. a bonus series' own sign-off. An episode
# that ends with one keeps it, and no interstitial plays after that episode.
bumpers = []

# The show's recurring segments. `labels create` sorts every stretch of an episode into one of
# these, and `plans draft` turns them into cuts and chapters. Write `describe` for the
# classifier: say what the segment sounds like. Only `label` and `describe` reach the
# classifier; changing the rest needs no relabeling.
[[shows.example-show.segments]]
label = "intro"
title = "Intro"
describe = "The recorded welcome and the theme song, before the hosts start talking."

[[shows.example-show.segments]]
label = "hosts"
title = "Hosts"
describe = "The hosts talking to each other, with no guest present."

[[shows.example-show.segments]]
label = "ads"
title = "Ads"
describe = "Read or produced advertising, usually with a jingle around it."
# `plans draft` cuts every confident `ads` segment.
cut = true
# Where the cut begins: "after-previous-speech" (default; the jingle leading in goes too) or
# "before-own-speech" (keep the jingle, cut from the ad's first word).
cut_start = "after-previous-speech"
# Where it ends: "before-next-speech" (default) or "after-own-speech" (keep the jingle after it).
cut_end = "before-next-speech"
# Phrases the hosts say right before and right after the segment. When present they decide the
# cut's edges more precisely than the labels can.
after_phrases = ["we'll be right back"]
before_phrases = ["welcome back"]

# Optional: the show's own chapter layout. Each episode gets one chapter per stretch between its
# breaks (the cuts with audio kept on both sides), titled in order from `parts`; `{name}` stands
# for the `title_pattern` group of that name, matched against the episode's title. An episode
# with a different number of breaks, or a title the pattern does not match, gets one chapter
# named after it. Without this table, `plans draft` makes a chapter per labeled segment.
[shows.example-show.chapters]
parts = ["Intro: {title}", "Guest: {guest}", "Outro: {title}"]
title_pattern = '^(?P<title>.+) with (?P<guest>.+)$'
